name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The public client id of the project's GitHub OAuth App (a repository variable, not a secret:
  # device-flow client ids are not confidential). Built into the binaries as the default.
  PROWL_GITHUB_CLIENT_ID: ${{ vars.PROWL_GITHUB_CLIENT_ID }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config rpm
      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: packaging/package.sh ${{ matrix.target }} "${GITHUB_REF_NAME#v}"
      - name: Sign macOS binaries
        # Optional: set these secrets to codesign. Only this step can see them.
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then echo "No signing certificate configured; skipping."; exit 0; fi
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          v="${GITHUB_REF_NAME#v}"; d="dist/prowl-$v-${{ matrix.target }}"
          for b in prowl prowld prowld-service; do
            codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$d/$b"
          done
          tar -C dist -czf "$d.tar.gz" "prowl-$v-${{ matrix.target }}"
          (cd dist && shasum -a 256 "prowl-$v-${{ matrix.target }}.tar.gz" > "prowl-$v-${{ matrix.target }}.tar.gz.sha256")
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging\package.ps1 -Target ${{ matrix.target }} -Version $env:GITHUB_REF_NAME.TrimStart('v')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Render Homebrew formula and Scoop manifest
        run: python3 packaging/render.py "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "PRowl $GITHUB_REF_NAME" --generate-notes \
            dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/*.sha256 dist/prowl.rb dist/prowl.json \
            install.sh install.ps1

  # Installs the release just published the way users do, on every platform.
  install-check:
    needs: release
    name: install-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" | sh -s "$GITHUB_REF_NAME" --no-service
          "$HOME/.local/bin/prowl" --version
          "$HOME/.local/bin/prowld" --version
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = Invoke-RestMethod "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/install.ps1"
          & ([scriptblock]::Create($script)) $env:GITHUB_REF_NAME -NoService
          & "$env:LOCALAPPDATA\Programs\prowl\prowl.exe" --version
          & "$env:LOCALAPPDATA\Programs\prowl\prowld.exe" --version
